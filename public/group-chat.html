<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>צ'אט הקבוצה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: Google Chat-like three columns in RTL: members (right), conversation (centre), context panel (left). */
:root{
  --bg:#F0F4F9; --surface:#FFFFFF; --surface2:#F8FAFD; --fg:#1F1F1F; --muted:#5F6368; --line:#E1E3E1;
  --accent:#0B57D0; --accent-ink:#FFFFFF; --accent-soft:#D3E3FD; --on-soft:#0B57D0; --field:#E9EEF6;
  --danger:#B3261E; --danger-soft:#FAD2CF; --ok:#1E8E3E; --badge:#B3261E; --badge-ink:#FFFFFF;
  --mark:#FFE9A0; --shadow:0 1px 3px rgba(0,0,0,.3); --scrim:rgba(0,0,0,.4); --quote:#EDF2FA;
  --font:'Heebo','Google Sans',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111317; --surface:#1B1D22; --surface2:#20242A; --fg:#E3E3E3; --muted:#A9AEB6; --line:#343840;
    --accent:#A8C7FA; --accent-ink:#062E6F; --accent-soft:#0842A0; --on-soft:#D3E3FD; --field:#2A2E36;
    --danger:#F2B8B5; --danger-soft:#601410; --ok:#81C995; --badge:#F2B8B5; --badge-ink:#601410;
    --mark:#5C4A00; --shadow:0 1px 3px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6); --quote:#242A33;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111317; --surface:#1B1D22; --surface2:#20242A; --fg:#E3E3E3; --muted:#A9AEB6; --line:#343840;
  --accent:#A8C7FA; --accent-ink:#062E6F; --accent-soft:#0842A0; --on-soft:#D3E3FD; --field:#2A2E36;
  --danger:#F2B8B5; --danger-soft:#601410; --ok:#81C995; --badge:#F2B8B5; --badge-ink:#601410;
  --mark:#5C4A00; --shadow:0 1px 3px rgba(0,0,0,.8); --scrim:rgba(0,0,0,.6); --quote:#242A33;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{flex:none}
#app{height:100%;display:flex;flex-direction:column}
#chat{height:100%;display:flex;flex-direction:column;min-height:0}

/* top bar */
.top{flex:none;min-height:64px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0}
.brand{display:flex;align-items:center;gap:12px;width:264px}
.brand .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.brand span{font-size:20px;font-weight:500;color:var(--muted)}
.search{flex:1;min-width:180px;max-width:720px;margin-inline:auto;height:48px;border-radius:24px;background:var(--field);display:flex;align-items:center;gap:12px;padding:0 16px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:16px;color:var(--fg);outline-offset:8px}
.search input::placeholder{color:var(--muted)}
.demo{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.demo select{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13px}
.mechip{display:flex;align-items:center;gap:10px}
.mechip .who{line-height:1.2;text-align:end}
.mechip .who b{display:block;font-weight:500;font-size:14px}
.mechip .who small{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border:0;background:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.iconbtn:hover{background:var(--field)}
.iconbtn.soft{background:var(--accent-soft);color:var(--on-soft)}
.iconbtn.bell{background:var(--accent-soft);color:var(--on-soft);width:44px;height:44px}
.count{min-width:18px;height:18px;border-radius:9px;background:var(--badge);color:var(--badge-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.iconbtn .count{position:absolute;top:1px;inset-inline-start:1px}
.only-narrow{display:none}

/* shell */
.shell{flex:1;min-height:0;display:flex;gap:12px;padding-bottom:12px;position:relative}
.card{background:var(--surface);border-radius:20px}
.side{width:280px;flex:none;display:flex;flex-direction:column;padding:16px;gap:12px;min-height:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;overflow:hidden}
.panel{width:340px;flex:none;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}

/* sidebar */
.ghead{display:flex;align-items:center;gap:12px}
.gpic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex:none}
.ghead b{display:block;font-size:16px;font-weight:500}
.ghead small{font-size:12px;color:var(--muted)}
.btn{height:40px;border:1px solid var(--muted);border-radius:20px;background:var(--surface);color:var(--accent);padding:0 18px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--accent-soft);color:var(--on-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{height:32px;padding:0 16px;border-radius:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.label{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.3px}
.members{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.mrow{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:12px;border:0;background:none;width:100%;text-align:start}
.mrow:hover{background:var(--surface2)}
.mrow .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:500;color:var(--on-soft);background:var(--accent-soft);border-radius:8px;padding:2px 8px}
.av{position:relative;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:500;flex:none}
.av .dot{position:absolute;bottom:-1px;inset-inline-start:-1px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.nav{border-top:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.navbtn{height:40px;border:0;background:none;border-radius:20px;padding:0 12px;display:flex;align-items:center;gap:12px;font-size:14px;text-align:start}
.navbtn:hover{background:var(--surface2)}
.navbtn span.t{flex:1}
.navbtn svg{color:var(--muted)}

/* conversation */
.convhead{flex:none;min-height:64px;display:flex;align-items:center;gap:8px;padding:0 20px;border-bottom:1px solid var(--line)}
.convhead .t{flex:1;min-width:0}
.convhead b{display:block;font-size:18px;font-weight:500}
.convhead small{font-size:12px;color:var(--muted)}
.pinbar{flex:none;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.pinbar .lbl{font-size:12px;font-weight:500;color:var(--on-soft);background:var(--accent-soft);border-radius:8px;padding:2px 8px;white-space:nowrap}
.pinbar .snip{flex:1;min-width:0;border:0;background:none;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 0}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 0;scroll-behavior:auto}
.dday{display:flex;align-items:center;gap:12px;padding:10px 24px}
.dday i{flex:1;height:1px;background:var(--line)}
.dday span{font-size:12px;font-weight:500;color:var(--muted)}
.dday.new i{background:var(--danger)} .dday.new span{color:var(--danger)}
.msg{position:relative;display:flex;gap:12px;padding:4px 24px;align-items:flex-start}
.msg:hover,.msg:focus-within{background:var(--surface2)}
.msg.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,60%{background:var(--accent-soft)}100%{background:transparent}}
.msg .gut{width:36px;flex:none}
.msg .body{flex:1;min-width:0}
.msg .meta{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.msg .meta b{font-size:14px;font-weight:700}
.msg .meta small{font-size:12px;color:var(--muted)}
.msg .text{font-size:15px;line-height:1.5;margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .reads{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding-top:4px;min-width:30px;justify-content:flex-end}
.ment{background:var(--accent-soft);color:var(--on-soft);border-radius:6px;padding:0 4px;font-weight:500}
.deleted{font-size:14px;font-style:italic;color:var(--muted);margin-top:2px}
.sys{text-align:center;padding:8px 24px;font-size:12px;color:var(--muted)}
.quote{display:block;width:100%;max-width:520px;margin:4px 0;border:0;border-inline-start:3px solid var(--accent);border-radius:4px 12px 12px 4px;background:var(--quote);text-align:start;padding:6px 12px}
.quote b{display:block;font-size:12px;font-weight:500;color:var(--on-soft)}
.quote span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rxs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.rx{position:relative;height:28px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.rx.mine{border-color:var(--accent);background:var(--accent-soft);color:var(--on-soft)}
.rx b{font-weight:500}
.rx[data-names]:hover::after,.rx[data-names]:focus-visible::after{content:attr(data-names);position:absolute;bottom:calc(100% + 6px);inset-inline-start:0;background:var(--fg);color:var(--bg);font-size:12px;padding:4px 8px;border-radius:6px;white-space:nowrap;z-index:5;pointer-events:none}
.tb{position:absolute;top:-18px;inset-inline-end:90px;height:36px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);display:none;align-items:center;padding:0 4px;gap:2px;z-index:3}
.msg:hover .tb,.msg:focus-within .tb{display:flex}
@media (hover:none){.tb{display:flex;position:static;box-shadow:none;background:none;height:auto;padding:0}}
.tb .iconbtn{width:32px;height:32px}
.attimg{display:block;margin-top:6px;padding:0;border:0;border-radius:16px;overflow:hidden;max-width:min(320px,100%);background:var(--field)}
.attimg img{display:block;width:100%;height:auto;max-height:240px;object-fit:cover}
.attvid{display:block;margin-top:6px;max-width:min(360px,100%);border-radius:16px;background:#000}
.filecard{display:flex;align-items:center;gap:12px;width:min(320px,100%);margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:start}
.filecard .ext{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:none;background:var(--accent-soft);color:var(--on-soft)}
.filecard .fn{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
.filecard small{display:block;font-size:12px;color:var(--muted)}
.editbox{margin-top:4px;display:flex;flex-direction:column;gap:8px;max-width:560px}
.editbox textarea,.field{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;resize:vertical}
.typing{flex:none;height:22px;padding:0 24px;font-size:12px;color:var(--muted)}
.notice{flex:none;margin:0 20px 8px;padding:8px 12px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:13px}
.upchip{flex:none;padding:0 20px 8px}
.upl{display:flex;align-items:center;gap:12px;width:min(380px,100%);padding:8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.upl .info{flex:1;min-width:0}
.upl .fn{font-size:13px;font-weight:500;direction:ltr;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .15s}
.composer{flex:none;padding:0 20px 20px}
.qbar{display:flex;align-items:center;gap:10px;margin:0 16px;padding:8px 12px;background:var(--quote);border-radius:16px 16px 0 0;border-inline-start:3px solid var(--accent)}
.qbar .in{flex:1;min-width:0}
.qbar b{display:block;font-size:12px;color:var(--on-soft);font-weight:500}
.qbar span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cbox{min-height:56px;border-radius:28px;background:var(--field);display:flex;align-items:flex-end;gap:4px;padding:8px 10px}
.cbox textarea{flex:1;min-width:0;border:0;background:none;resize:none;padding:8px;font-size:15px;line-height:1.4;max-height:140px;outline-offset:4px}
.cbox .iconbtn{color:var(--muted)} .cbox .iconbtn.soft{color:var(--on-soft)} #send{color:var(--accent)}
.main.drag::after{content:"שחרור הקובץ להעלאה";position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-soft);color:var(--on-soft);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:500;z-index:8;opacity:.94}

/* panel */
.phead{flex:none;min-height:64px;display:flex;align-items:center;gap:8px;padding:0 8px 0 16px;border-bottom:1px solid var(--line)}
.phead b{flex:1;font-size:18px;font-weight:500;padding-inline-start:8px}
.tabs{flex:none;display:flex;gap:8px;padding:12px 16px;flex-wrap:wrap}
.tab{height:32px;border:1px solid var(--muted);border-radius:8px;background:var(--surface);padding:0 14px;font-size:14px}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--on-soft);border-color:var(--accent-soft);font-weight:500}
.plist{flex:1;min-height:0;overflow-y:auto}
.item{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);width:100%;border-inline:0;border-top:0;background:none;text-align:start}
button.item:hover{background:var(--surface2)}
.item .ic{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--on-soft);font-weight:700}
.item .ic.red{background:var(--danger-soft);color:var(--danger)}
.item .c{flex:1;min-width:0}
.item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.item .snip{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item.unread{background:var(--surface2)}
mark{background:var(--mark);color:inherit;border-radius:3px}
.empty{padding:32px 24px;text-align:center;color:var(--muted)}

/* popups */
.pop{position:fixed;z-index:60;background:var(--surface);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.35);border:1px solid var(--line)}
.menu{min-width:200px;padding:6px}
.menu button{width:100%;height:40px;border:0;background:none;border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:12px;text-align:start;font-size:14px}
.menu button:hover,.menu button.on{background:var(--field)}
.menu button.danger{color:var(--danger)}
.picker{width:min(332px,calc(100vw - 16px));padding:12px;display:flex;flex-direction:column;gap:10px}
.picker input{height:36px;border:0;border-radius:18px;background:var(--field);padding:0 14px;font-size:14px}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding-bottom:4px}
.ptabs button{flex:1;height:34px;border:0;background:none;border-radius:8px;font-size:18px}
.ptabs button[aria-pressed="true"]{background:var(--accent-soft)}
.pgrid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:2px;max-height:168px;overflow-y:auto}
.pgrid button{height:36px;border:0;background:none;border-radius:8px;font-size:22px;line-height:1}
.pgrid button:hover{background:var(--field)}
.tones{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.tones button{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0}
.tones button[aria-pressed="true"]{border-color:var(--accent)}
.mlist{padding:6px;min-width:220px}
.mlist button{width:100%;height:40px;border:0;background:none;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:10px;text-align:start}
.mlist button.on,.mlist button:hover{background:var(--field)}
#toast{position:fixed;z-index:90;bottom:max(24px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

/* modal */
.backdrop{position:fixed;inset:0;background:var(--scrim);z-index:70}
.dialog{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);width:min(640px,calc(100vw - 24px));max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--surface);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,.4);overflow:hidden}
.dialog.wide{width:min(820px,calc(100vw - 24px))}
.dhead{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 12px 24px;border-bottom:1px solid var(--line)}
.dhead b{flex:1;font-size:18px;font-weight:500}
.dbody{overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.dfoot{flex:none;display:flex;gap:8px;justify-content:flex-start;padding:12px 24px;border-top:1px solid var(--line)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.lbl2{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.card2{border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ctx{display:flex;flex-direction:column;gap:4px;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:13px}
.ctx .hit{background:var(--accent-soft);color:var(--on-soft);border-radius:8px;padding:4px 8px}
.logrow{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.logrow time{color:var(--muted);font-size:12px;min-width:120px;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:12px;border:2px solid transparent;font-weight:700}
.swatches button[aria-pressed="true"]{border-color:var(--accent)}
.invite{display:flex;gap:8px;align-items:center}
.invite code{flex:1;min-width:0;direction:ltr;text-align:start;background:var(--field);border-radius:10px;padding:8px 12px;font-size:13px;overflow-x:auto;white-space:nowrap;user-select:all}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}

/* full screens */
.screen{height:100%;display:flex;align-items:center;justify-content:center;padding:24px 0}
.screen .box{width:min(440px,100%);background:var(--surface);border-radius:28px;padding:40px 32px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.screen h1{margin:0;font-size:26px;font-weight:700;text-wrap:balance}
.screen p{margin:0;color:var(--muted);font-size:15px;max-width:34ch}

/* ---------- events ---------- */
var ACT={
 send:function(){sendMsg()},
 side:function(){S.drawer=S.drawer==='side'?null:'side';renderSide()},
 scrim:function(){S.drawer=null;if(innerWidth<=1100&&S.panel)S.panel=null;renderSide();renderPanel()},
 bell:function(){S.panel='notifs';if(innerWidth<=1100)S.drawer='panel';renderPanel();markRead()},
 tab:function(a){S.panel=a.dataset.t;if(innerWidth<=1100)S.drawer='panel';renderPanel();if(S.panel==='notifs')markRead();if(S.panel==='search')$('#q').focus()},
 'panel-close':function(){S.panel=null;S.drawer=null;renderPanel();renderSide()},
 'jump-pin':function(){var p=pins();if(!p.length)return;var m=p[S.pinIdx%p.length];jump(m.id);S.pinIdx=(S.pinIdx+1)%p.length;renderPinbar()},
 jump:function(a){jump(a.dataset.id)},
 quote:function(a){var m=byId(a.dataset.id);S.replyTo={id:m.id,author:m.author,text:snippetOf(m)};renderQbar();$('#txt').focus()},
 'quote-cancel':function(){S.replyTo=null;renderQbar()},
 'react-open':function(a){openPicker(a,{type:'react',id:a.dataset.id})},
 'emoji-compose':function(a){openPicker(a,{type:'compose'})},
 rx:function(a){toggleReact(a.dataset.id,a.dataset.e)},
 more:function(a){msgMenu(a.dataset.id,a)},
 ptab:function(a){S.pickTab=a.dataset.t;S.pickQ='';drawPicker()},
 tone:function(a){S.tone=+a.dataset.i;drawPicker()},
 pick:function(a){
  var e=a.dataset.e,t=S.pickTarget;closePops();
  if(t&&t.type==='react')toggleReact(t.id,e);
  else{var ta=$('#txt'),p=ta.selectionStart||ta.value.length;ta.value=ta.value.slice(0,p)+e+ta.value.slice(p);ta.focus();ta.setSelectionRange(p+e.length,p+e.length);pushRecent(e);saveDraft();grow()}
 },
 'edit-save':function(){var m=byId(S.editing),t=$('#edit-txt').value.trim();if(!t)return;if(t!==m.text){m.text=t;m.edited=true}S.editing=null;renderMsgsKeep()},
 'edit-cancel':function(){S.editing=null;renderMsgsKeep()},
 attach:function(){$('#file').click()},
 'up-cancel':function(){clearInterval(upT);S.up=null;renderUp();toast('ההעלאה בוטלה')},
 lightbox:function(a){var img=$('img',a);S.modal={t:'lightbox',src:img.src,name:img.alt};renderModal()},
 'open-file':function(a){toast('בגרסה המלאה הקובץ "'+a.dataset.name+'" ייפתח בכרטיסייה חדשה')},
 unpin:function(a){pinToggle(a.dataset.id)},
 approve:function(a){approve(a.dataset.id)},
 reject:function(a){reject(a.dataset.id)},
 modal:function(a){S.modal={t:a.dataset.m};if(innerWidth<=1100){S.drawer=null;renderSide()}renderModal()},
 'close-modal':function(){S.modal=null;renderModal()},
 'member-menu':function(a){
  var id=a.dataset.id;if(!isAdmin()||id==='me')return;var m=mem(id),it=[];
  if(m.role!=='admin')it.push({label:G(id,'מינוי למנהל','מינוי למנהלת'),icon:'up',fn:function(){m.role='admin';sys(U[id].n+' '+G(id,'מונה','מונתה')+' '+G(id,'למנהל','למנהלת'));audit('promoted','me',id);toast(U[id].n+' '+G(id,'מונה','מונתה')+' '+G(id,'למנהל','למנהלת'));refreshAll()}});
  it.push({label:'הסרה מהקבוצה',icon:'out',danger:true,fn:function(){S.modal={t:'remove',id:id};renderModal()}});
  openMenu(it,a);
 },
 'do-remove':function(a){removeMember(a.dataset.id,a.dataset.rep)},
 leave:function(){
  if(isAdmin()&&admins().length<2){toast('את המנהלת היחידה. מני מנהל נוסף מרשימת החברים לפני שעוזבים.');return}
  S.modal={t:'leave'};if(innerWidth<=1100){S.drawer=null;renderSide()}renderModal();
 },
 'do-leave':function(){mem('me').st='left';sys(U.me.n+' עזבה את הקבוצה');audit('left',null,'me');S.modal=null;S.screen='nogroup';$('#demo').value='nogroup';renderAll()},
 'copy-invite':function(){copyText('https://chat.example/join/'+S.group.token)},
 regen:function(){S.group.token=Math.random().toString(36).slice(2,8);renderModal();toast('נוצר קישור חדש. הקישור הקודם הפסיק לעבוד')},
 swatch:function(a){S.group.bg=a.dataset.bg;S.group.ink=a.dataset.ink;renderModal();renderSide()},
 'save-settings':function(){
  var n=$('#s-name').value.trim()||S.group.name,d=$('#s-desc').value.trim();
  if(n!==S.group.name){sys('שם הקבוצה שונה ל-'+n);audit('group_changed','me',null,{outcome:'שם הקבוצה'});S.group.name=n}
  if(d!==S.group.desc){S.group.desc=d;audit('group_changed','me',null,{outcome:'תיאור'})}
  S.modal=null;toast('הפרטים נשמרו');refreshAll();
 },
 'send-report':function(a){
  var r={id:'r'+Date.now(),msg:a.dataset.id,reporter:'me',reason:($('#r-reason').value||'').trim(),st:'open',ts:Date.now()};
  S.reports.push(r);S.notifs.push({id:'n'+r.id,type:'report',rep:r.id,for:'admin',ts:Date.now(),read:false});
  audit('report_filed','me',byId(a.dataset.id).author,{msg:a.dataset.id});S.modal=null;toast('הדיווח נשלח למנהלים');refreshAll();
 },
 'rep-delete':function(a){var r=S.reports.filter(function(x){return x.id===a.dataset.id})[0];delMsg(r.msg);r.st='resolved_deleted';audit('report_resolved','me',byId(r.msg).author,{outcome:'ההודעה נמחקה'});refreshAll()},
 'rep-remove':function(a){var r=S.reports.filter(function(x){return x.id===a.dataset.id})[0];S.modal={t:'remove',id:byId(r.msg).author,rep:r.id};renderModal()},
 'rep-dismiss':function(a){var r=S.reports.filter(function(x){return x.id===a.dataset.id})[0];r.st='dismissed';audit('report_resolved','me',byId(r.msg).author,{outcome:'הדיווח נדחה'});toast('הדיווח נדחה');refreshAll()},
 signin:function(){var me=mem('me');me.st='active';S.screen='chat';S.firstRender=true;$('#demo').value=S.role;renderAll();toBottom()},
 signout:function(){S.screen='landing';renderAll()},
 'mention-pick':function(a){mentionInsert(a.dataset.id)}
};
function markRead(){var any=false;visNotifs().forEach(function(n){if(n.type!=='join'&&!n.read){n.read=true;any=true}});if(any)setTimeout(function(){renderTop()},600)}

document.addEventListener('click',function(e){
  var t=e.target;
  if(!t.closest('.pop'))closePops();
  var mi=t.closest('[data-menu]');
  if(mi){var f=S.menuFns[+mi.dataset.menu];closePops();if(f)f.fn();return}
  var a=t.closest('[data-act]');if(!a)return;
  var fn=ACT[a.dataset.act];if(fn)fn(a,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='txt'){saveDraft();grow();mentionUpdate()}
  else if(t.id==='q'){S.q=t.value;if(S.q.trim()||S.panel==='search'){S.panel='search';if(innerWidth<=1100)S.drawer='panel';renderPanel()}}
  else if(t.id==='pk-q'){S.pickQ=t.value;var tabs=$$('.ptabs button');tabs.forEach(function(b){b.setAttribute('aria-pressed','false')});fillGrid()}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='demo'||t.id==='demo2')setDemo(t.value);
  else if(t.id==='af-action'){S.auditF.action=t.value;renderModal()}
  else if(t.id==='af-actor'){S.auditF.actor=t.value;renderModal()}
  else if(t.id==='file'){if(t.files&&t.files[0])startUpload(t.files[0]);t.value=''}
});
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Escape'){
    if(S.modal){S.modal=null;renderModal();return}
    if(!$('#menu').hidden||!$('#picker').hidden||!$('#mentions').hidden){closePops();return}
    if(S.editing){S.editing=null;renderMsgsKeep();return}
    if(S.drawer){S.drawer=null;renderSide();renderPanel()}
    return;
  }
  if(t.id==='txt'){
    if(S.mention&&!$('#mentions').hidden){
      var M=S.mention;
      if(e.key==='ArrowDown'){e.preventDefault();M.idx=(M.idx+1)%M.list.length;drawMention();return}
      if(e.key==='ArrowUp'){e.preventDefault();M.idx=(M.idx-1+M.list.length)%M.list.length;drawMention();return}
      if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();mentionInsert(M.list[M.idx]);return}
    }
    if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMsg()}
  }else if(t.id==='edit-txt'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACT['edit-save']()}
});
document.addEventListener('keyup',function(e){if(e.target.id==='txt'&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))mentionUpdate()});
document.addEventListener('paste',function(e){
  if(e.target.id!=='txt'||!e.clipboardData)return;
  var f=e.clipboardData.files;if(f&&f.length){e.preventDefault();startUpload(f[0])}
});
var main=$('#main');
['dragenter','dragover'].forEach(function(n){main.addEventListener(n,function(e){if(e.dataTransfer&&Array.prototype.indexOf.call(e.dataTransfer.types||[],'Files')>=0){e.preventDefault();main.classList.add('drag')}})});
['dragleave','drop'].forEach(function(n){main.addEventListener(n,function(e){if(n==='dragleave'&&main.contains(e.relatedTarget))return;main.classList.remove('drag')})});
main.addEventListener('drop',function(e){e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files;if(f&&f.length)startUpload(f[0])});
window.addEventListener('resize',function(){if(innerWidth>1100&&S.drawer){S.drawer=null;renderSide();renderSideScrim()}});

/* ---------- boot ---------- */
(function(){
  document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','he');
  S.panel=innerWidth>1200?'notifs':null;S.firstRender=true;
  loadDraft();renderAll();grow();toBottom();
  setTimeout(function(){if(S.screen!=='chat')return;S.typing='noa';renderTyping()},1500);
  setTimeout(function(){
    if(S.typing!=='noa')return;S.typing=null;renderTyping();if(S.screen!=='chat')return;
    var nb=nearBottom(),m=mk({author:'noa',text:'בסדר, אני מעדכנת את הטבלה ומשתפת עוד מעט.',reads:2});S.msgs.push(m);renderMsgs(true);if(nb)toBottom();
  },6500);
})();
})();
</script>

</body></html>
